<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fee Receipt — Gyanodaya Uchch Vidyalaya</title>
<link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="1.jpg">
</head>
<body>
<div class="app">

  <!-- LEFT: FORM -->
  <div class="panel">
    <div class="panel-head">&#9998; Form Bharein</div>
    <div class="form-body">

      <div class="slabel">Receipt Info</div>
      <div class="row2">
        <div class="fg"><label>Rec. No.</label><input id="recno" type="text" placeholder="jaise 17" oninput="update()"></div>
        <div class="fg"><label>Date</label><input id="rdate" type="date" oninput="update()"></div>
      </div>

      <div class="slabel">Student Details</div>
      <div class="fg"><label>Student Name</label><input id="sname" type="text" placeholder="Poora naam likhein" oninput="update()"></div>
      <div class="fg"><label>Father's Name</label><input id="fname" type="text" placeholder="Pita ka naam" oninput="update()"></div>
      <div class="row2">
        <div class="fg"><label>Adm. No.</label><input id="admno" type="text" placeholder="jaise 05" oninput="update()"></div>
        <div class="fg"><label>Mode</label>
          <select id="mode" onchange="update()">
            <option value="">-- Select--</option>
            <option>Cash</option><option>Cheque</option><option>Online</option><option>DD</option>
          </select>
        </div>
      </div>
      <div class="row3">
        <div class="fg"><label>Class</label>
          <select id="cls" onchange="update()">
            <option value="">--</option>
            <option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option>
            <option>VI</option><option>VII</option><option>VIII</option><option>IX</option>
            <option>X</option><option>XI</option><option>XII</option>
          </select>
        </div>
        <div class="fg"><label>Section</label>
          <select id="sec" onchange="update()">
            <option value="">--</option>
            <option>A</option><option>B</option><option>C</option><option>D</option>
          </select>
        </div>
        <div class="fg"><label>Roll No.</label><input id="roll" type="text" placeholder="jaise 2" oninput="update()"></div>
      </div>
      <div class="fg"><label>Month</label>
        <select id="month" onchange="update()">
          <option value="">-- Mahina Chunein --</option>
          <option>January</option><option>February</option><option>March</option><option>April</option>
          <option>May</option><option>June</option><option>July</option><option>August</option>
          <option>September</option><option>October</option><option>November</option><option>December</option>
        </select>
      </div>

      <div class="slabel">Fee Details (Rs.)</div>
      <div class="fee-row"><span>Tuition Fee</span><input id="fee" type="number" placeholder="0" oninput="calc()"></div>
      <div class="fee-row"><span>Late Fine</span><input id="fine" type="number" placeholder="0" oninput="calc()"></div>
      <div class="fee-row"><span>Previous Dues</span><input id="prev" type="number" placeholder="0" oninput="calc()"></div>
      <div class="fee-row"><span>Concession</span><input id="conc" type="number" placeholder="0" oninput="calc()"></div>
      <div class="fee-row">
        <span style="font-weight:600;color:#111">Total Amount</span>
        <div class="computed" id="total_disp">0.00</div>
      </div>
      <div class="fee-row"><span>Paid Amount</span><input id="paid" type="number" placeholder="0" oninput="calc()"></div>
      <div class="fee-row">
        <span style="font-weight:600;color:#b91c1c">Balance Dues</span>
        <div class="computed" id="dues_disp" style="color:#b91c1c">0.00</div>
      </div>

      <button class="btn-update" onclick="update()">&#8635; Preview Update Karo</button>
      <button class="btn-print" onclick="window.print()">&#128438; Print / Download</button>
    </div>
  </div>

  <!-- RIGHT: LIVE PREVIEW -->
  <div class="panel">
    <div class="panel-head">&#128196; Live Preview</div>
    <div id="preview">
      <div class="empty-state">
        <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#9ca3af" stroke-width="1.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <p>Form bharein — receipt yahan dikhegi</p>
      </div>
    </div>
  </div>

</div>

</body>
<script src="style.js"></script>
</html>
